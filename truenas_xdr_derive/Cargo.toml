# `truenas_xdr_derive` — the `XdrEnum` and `XdrUnion` derive macros for
# `truenas_xdr`. A proc-macro needs its own crate; depend on `truenas_xdr` with
# its `derive` feature rather than on this directly.
[package]
name = "truenas_xdr_derive"
version = "0.1.0"
description = "Derive macros for the truenas_xdr codec"
categories = ["encoding"]
keywords = ["xdr", "serde", "derive"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[lints]
workspace = true
