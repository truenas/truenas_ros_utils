name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Some failures only ever reproduce on the runner, and a bare `panicked at
# file:line` with no frames is not enough to chase one from a log.
env:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: always

# Every cargo step passes --locked: Cargo.lock is committed, so a lockfile that
# has drifted from the manifests fails here rather than being rewritten in
# place and hiding the drift.

jobs:
  check:
    name: build + test (stable)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # liblmdb-dev links truenas_mdb. python3-lmdb is the second implementation
    # its interop suite runs against, and must be the distro package, which
    # links the system liblmdb0 — `pip install lmdb` bundles its own copy and
    # would test something else. libpam0g-dev links truenas_pam, and
    # libpam-modules supplies the modules its service files name. libssl-dev
    # links truenas_ktls. valgrind backs the memcheck step below. truenas_nss
    # needs nothing here: its fixture suites use the runner's C compiler, and
    # the system module its smoke tests load, libnss_files.so.2, ships in
    # libc6.
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          liblmdb-dev python3-lmdb libpam0g-dev libpam-modules libssl-dev \
          pkg-config valgrind
        python3 -c "import lmdb; print('py-lmdb', lmdb.__version__, 'liblmdb', lmdb.version())"
        dpkg-query -W libpam0g-dev libpam-modules libssl-dev
        valgrind --version

    - name: Install Rust toolchain
      run: |
        rustup toolchain install stable --profile minimal
        rustup component add clippy rustfmt
        rustup default stable
        cargo --version && rustc --version

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: cargo-${{ runner.os }}-stable-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

    - name: rustfmt
      run: cargo fmt --all --check

    - name: build
      run: cargo build --workspace --all-targets --locked

    - name: clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

    # The interop suite skips itself when python3-lmdb is missing, the PAM
    # suites when a module they name is, and the NSS suites when the C
    # compiler or the system files module is. We do NOT want any to pass
    # silently as green — the runner guarantees all are present, so require
    # them and let a skip be a failure.
    #
    # TRUENAS_KTLS_REQUIRE_SYSTEM is deliberately absent: the runner's kernel
    # has the tls upper-layer protocol, but its OpenSSL is built without kTLS
    # support, so an engagement can never happen here. truenas_ktls's
    # engagement cases skip themselves on that probe; the rest of its suite
    # still runs. Hosts whose libssl can engage run the full battery with the
    # gate required.
    - name: test
      run: cargo test --workspace --locked
      env:
        TRUENAS_MDB_REQUIRE_PYTHON: "1"
        TRUENAS_PAM_REQUIRE_MODULES: "1"
        TRUENAS_NSS_REQUIRE_CC: "1"
        TRUENAS_NSS_REQUIRE_SYSTEM: "1"

    # `truenas_xdr`'s `derive` feature is on by default; prove the codec still
    # builds and passes without the proc-macro crate.
    - name: test without default features
      run: cargo test -p truenas_xdr --no-default-features --locked

    # Correctness at an FFI boundary is a memory-safety property, so the suites
    # run again under memcheck. Only `definite` leaks count as errors: the
    # environment pool is a process-lifetime static, which memcheck reports as
    # possibly lost. `--keep-debuginfo=yes` is for truenas_pam: libpam unloads
    # each module at the end of a transaction, and a report from inside one
    # would otherwise have no symbols left to name.
    - name: valgrind
      run: cargo test --workspace --locked
      env:
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: >-
          valgrind --error-exitcode=99 --leak-check=full
          --errors-for-leak-kinds=definite --keep-debuginfo=yes --quiet
        TRUENAS_MDB_REQUIRE_PYTHON: "1"
        TRUENAS_PAM_REQUIRE_MODULES: "1"
        TRUENAS_NSS_REQUIRE_CC: "1"
        TRUENAS_NSS_REQUIRE_SYSTEM: "1"

    - name: docs
      run: cargo doc --workspace --no-deps --locked
      env:
        RUSTDOCFLAGS: "-D warnings"

  # `rust-version` in [workspace.package] is a promise to consumers. Build and
  # test on exactly that toolchain so raising the floor is a deliberate edit
  # rather than something that happens when a newer feature is used by accident.
  msrv:
    name: build + test (MSRV 1.97.1)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          liblmdb-dev python3-lmdb libpam0g-dev libpam-modules libssl-dev \
          pkg-config

    - name: Install Rust toolchain
      run: |
        msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
        echo "Declared MSRV: $msrv"
        rustup toolchain install "$msrv" --profile minimal
        rustup default "$msrv"
        cargo --version && rustc --version

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: cargo-${{ runner.os }}-msrv-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

    - name: build
      run: cargo build --workspace --all-targets --locked

    - name: test
      run: cargo test --workspace --locked
      env:
        TRUENAS_MDB_REQUIRE_PYTHON: "1"
        TRUENAS_PAM_REQUIRE_MODULES: "1"
        TRUENAS_NSS_REQUIRE_CC: "1"
        TRUENAS_NSS_REQUIRE_SYSTEM: "1"
